version: "3.8"

services:
  modexa:
    container_name: modexa
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      MODEXA_DATABASE_PATH: /app/data/modexa.sqlite
    ports:
      # aaPanel/Nginx proxies HTTPS traffic to this loopback-only port.
      # Do not expose port 3000 publicly.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
      # Runner uses Node's --env-file=.env when it is started by the API.
      - ./.env:/app/.env:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
