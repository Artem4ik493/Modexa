help.title: 'Modexa guide'
help.intro: 'Welcome to the Modexa knowledge base. It explains features, concepts, and workflows. Choose a topic below. The full command list is available separately in /commands.'
help.topic.start: '🚀 Getting started'
help.topic.account: '👤 Account and linking'
help.topic.community: '👥 Communities and members'
help.topic.moderation: '🛡 Moderation'
help.topic.bridge: '🌉 Telegram ↔ Discord Bridge'
help.topic.settings: '⚙️ Settings and permissions'
help.page.start: 'Modexa unifies community management for Telegram and Discord. Start in a private chat with the bot: open your account, review settings, and link platform accounts if you want to use cross-platform features. Groups and servers provide a community context.'
help.page.account: 'A Modexa account is a unified internal identity. Telegram and Discord accounts are linked only through an explicit one-time code flow. Matching display names or usernames never link accounts automatically. Account management is available in a private chat with the bot.'
help.page.community: 'A Modexa community is the shared model for a Telegram group or Discord server: members, roles, channels, settings, and links. Membership can be active, left, or banned. Leaving or being unbanned does not itself grant access to community actions before the user rejoins.'
help.page.moderation: 'Moderation actions go through the shared Core after access checks and platform target resolution. A warning is stored as a case; a mute restricts messaging for a duration; a kick removes a member without a permanent ban; a ban blocks access. Lifting restrictions also depends on the bot''s platform permissions and configuration. Include a reason to keep the moderation history useful.'
help.page.bridge: 'Bridge relays messages between linked Telegram and Discord channels. It requires correctly linked endpoints, appropriate bot permissions to read and send messages, and compatible privacy settings. Some attachment types depend on the capabilities of each platform.'
help.page.settings: 'Community settings and actions require the corresponding Modexa permissions. A platform administrator and a Modexa role are not the same thing: an action requires both Modexa authorization and sufficient bot permissions in Telegram or Discord. Direct messages expose only user-scoped features.'
