help.title: 'Путеводитель по Modexa'
help.intro: 'Добро пожаловать в базу знаний Modexa. Здесь собраны объяснения возможностей, принципы работы и инструкции. Выберите интересующий раздел ниже. Полный список команд находится отдельно в /commands.'
help.topic.start: '🚀 Начало работы'
help.topic.account: '👤 Аккаунт и связка'
help.topic.community: '👥 Сообщества и участники'
help.topic.moderation: '🛡 Модерация'
help.topic.bridge: '🌉 Telegram ↔ Discord Bridge'
help.topic.settings: '⚙️ Настройки и права'
help.page.start: 'Modexa объединяет управление сообществами Telegram и Discord. Начните с личного чата с ботом: откройте аккаунт, ознакомьтесь с настройками и привяжите платформенные аккаунты, если хотите использовать функции, связывающие обе платформы. В группах и на серверах доступен контекст сообщества.'
help.page.account: 'Аккаунт Modexa — единая внутренняя учётная запись. Telegram и Discord связываются только явным подтверждением через одноразовый код. Совпадение имени или username не связывает аккаунты автоматически. Управление аккаунтом доступно в личном чате с ботом.'
help.page.community: 'Сообщество Modexa хранит общую модель группы Telegram или сервера Discord: участников, роли, каналы, настройки и связи. Состояние участия может быть активным, покинувшим или заблокированным. Выход и разбан сами по себе не дают права выполнять действия до повторного вступления.'
help.page.moderation: 'Модерационные действия выполняются через общий Core после проверки прав и доступности цели на платформе. Предупреждение сохраняется как кейс; мут ограничивает отправку сообщений на срок; kick удаляет участника без постоянного бана; ban блокирует доступ. Снятие ограничений зависит также от прав и настроек самого бота на платформе. Указывайте причину наказания, чтобы история была понятнее.'
help.page.bridge: 'Bridge пересылает сообщения между связанными каналами Telegram и Discord. Для работы нужны корректно связанные конечные точки, права бота на чтение и отправку сообщений и совместимые настройки приватности. Поддержка типов вложений зависит от возможностей конкретной платформы.'
help.page.settings: 'Настройки и действия сообщества доступны участникам с соответствующими разрешениями Modexa. Администратор платформы и роль Modexa — не одно и то же: для действия требуются права Modexa и достаточные права бота в Telegram или Discord. В личном чате доступны только функции пользовательского контекста.'
